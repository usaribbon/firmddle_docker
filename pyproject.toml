[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "firmddle"
version = "0.1.0a0"
description = "Firmware evidence extraction and backdoor clue hunting CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "usaribbon" }
]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]

[project.scripts]
firmddle = "firmddle.cli:main"

[project.urls]
Homepage = "https://github.com/usaribbon/firmddle_docker"
Repository = "https://github.com/usaribbon/firmddle_docker"
Issues = "https://github.com/usaribbon/firmddle_docker/issues"

[tool.setuptools.packages.find]
include = ["firmddle*"]
