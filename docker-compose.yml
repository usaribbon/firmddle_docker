services:
  firmddle:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    image: firmddle-cli:dev
    volumes:
      - ./workspace:/workspace
      - ./raw_firmwares:/repo/raw_firmwares:ro

  ghidra-gui:
    profiles:
      - legacy-gui
    build:
      context: .
      dockerfile: ./gui/Dockerfile
    container_name: firmddle-ghidra-gui
    tty: true
    ports:
      - "8080:80"
    volumes:
      - type: bind
        source: ./raw_firmwares
        target: /mnt/raw_firmwares
